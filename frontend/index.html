<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">void</h1>
    <div id="auth-status"></div>
  </header>

  <main>
    <!-- Auth panel -->
    <section id="auth-panel" class="card">
      <div class="tabs">
        <button id="tab-signin" class="tab active">Sign in</button>
        <button id="tab-signup" class="tab">Sign up</button>
      </div>
      <input id="email" type="email" placeholder="email" autocomplete="email" />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      <input id="username" type="text" placeholder="username" class="hidden" />
      <button id="auth-submit" class="primary">Sign in</button>
      <p id="auth-error" class="error"></p>
    </section>

    <!-- Composer -->
    <section id="composer" class="card hidden">
      <textarea id="post-content" maxlength="500" placeholder="say something into the void..."></textarea>
      <div class="composer-row">
        <span id="char-count">0/500</span>
        <button id="post-submit" class="primary">Post</button>
      </div>
    </section>

    <!-- Feed -->
    <section id="feed"></section>
  </main>

  <!-- Supabase JS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Local config (gitignored). Copy config.example.js -> config.js -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
